# ============================================================
# A股量化复盘与交易决策系统 V3.0 — 策略配置
# ============================================================
# 所有评分权重、阈值、仓位参数在此配置
# 禁止在代码中硬编码任何策略参数

# ---- 市场综合评分权重 ----
market_score:
  weights:
    trend: 0.20            # 指数趋势
    breadth: 0.15          # 市场宽度
    liquidity: 0.15        # 量能/流动性
    sentiment: 0.15        # 情绪
    mainline: 0.15         # 主线强度
    consistency: 0.10      # 一致性
    high_level_risk: 0.10  # 高位股风险（反向）

# ---- 市场状态机阈值 ----
market_state:
  thresholds:
    extreme_bull: 85       # 极强主升
    bull: 72               # 主升
    strong_range: 60       # 强势震荡
    weak_range: 45         # 弱势震荡
    bear: 30               # 退潮
    extreme_bear: 20       # 极端退潮
  # 状态转换需连续确认天数
  confirmation_days: 2

# ---- 市场趋势评分 ----
market_trend:
  index_codes:
    - "000001"   # 上证指数
    - "399001"   # 深证成指
    - "399006"   # 创业板指
    - "000688"   # 科创50
  ma_periods: [5, 10, 20, 60]
  rsi_period: 14
  macd_fast: 12
  macd_slow: 26
  macd_signal: 9

# ---- 市场宽度 ----
market_breadth:
  # 涨跌比阈值
  strong_ratio: 2.0        # 上涨/下跌 > 2.0 = 强
  weak_ratio: 0.5          # 上涨/下跌 < 0.5 = 弱

# ---- 量能评分 ----
liquidity:
  ma_periods: [5, 10, 20]
  volume_surge_threshold: 1.3    # 放量阈值（vs 20日均值）
  volume_shrink_threshold: 0.7   # 缩量阈值

# ---- 情绪评分 ----
sentiment:
  # 涨停数量区间
  limit_up_strong: 80
  limit_up_weak: 20
  # 炸板率
  broken_rate_high: 0.40
  broken_rate_low: 0.15

# ---- 个股综合评分权重 ----
stock_score:
  weights:
    industry_trend: 0.15     # 产业趋势
    sector_strength: 0.15    # 板块强度
    stock_trend: 0.20        # 个股趋势
    volume_price: 0.10       # 量价结构
    relative_strength: 0.10  # 资金强度/RS
    market_match: 0.10       # 市场匹配
    position_odds: 0.10      # 位置/赔率
    crowding: 0.05           # 拥挤度（反向）
    catalyst: 0.05           # 催化剂

# ---- 个股趋势阶段定义 ----
stock_trend:
  ma_periods: [5, 10, 20, 60]
  # 趋势阶段判断阈值
  stages:
    acceleration:
      min_slope_20: 0.03
      min_pct_5d: 0.08
    main_rise:
      min_slope_20: 0.015
      above_ma20: true
    trend_start:
      cross_ma20: true
      volume_confirm: true
    base_building:
      range_pct_20d: 0.10
    trend_broken:
      below_ma20: true
      below_ma60: true

# ---- 相对强度 RS ----
relative_strength:
  periods: [1, 5, 20, 60]
  benchmark_codes:
    - "000001"   # 对比上证
    - "399006"   # 对比创业板

# ---- 拥挤度 ----
crowding:
  high_threshold: 75
  medium_threshold: 50
  factors:
    consecutive_up_days: 0.25
    recent_gain_20d: 0.25
    turnover_ratio: 0.20
    sector_heat: 0.15
    price_position: 0.15

# ---- 买点评分 ----
entry_score:
  breakout_weight: 0.30
  pullback_weight: 0.25
  trend_add_weight: 0.20
  ma_support_weight: 0.15
  risk_penalty_weight: 0.10

# ---- 板块/主线 ----
sector:
  # 主线持续性最低天数
  mainline_min_days: 3
  # 扩散度阈值
  diffusion_strong: 0.60     # 60% 个股上涨
  diffusion_weak: 0.30
  # 前N主线
  top_mainlines: 3
  # 板块强度计算周期
  strength_periods: [1, 5, 20]

# ---- 仓位引擎 ----
position:
  # 总资金
  total_capital: 200000
  # 市场状态 → 仓位范围
  state_position_map:
    extreme_bull: [0.80, 0.95]
    bull: [0.65, 0.85]
    strong_range: [0.50, 0.70]
    weak_range: [0.30, 0.50]
    bear: [0.10, 0.30]
    extreme_bear: [0.00, 0.15]
  # 仓位类型默认比例
  type_allocation:
    core_leader: [0.20, 0.25]
    core_mid: [0.15, 0.20]
    trend_growth: [0.10, 0.15]
    high_beta: [0.08, 0.10]
    trial: [0.03, 0.05]

# ---- 风险预算 ----
risk:
  max_single_risk_pct: 1.0       # 单笔最大风险 1%
  max_portfolio_drawdown: 8.0    # 组合最大回撤 8%
  max_industry_exposure: 40.0    # 单行业最大暴露 40%
  max_theme_exposure: 50.0       # 单主题最大暴露 50%
  max_single_stock_weight: 25.0  # 单只股票最大仓位 25%

# ---- 动态止损 ----
stop_loss:
  methods:
    - type: "atr"
      multiplier: 2.0
      period: 14
    - type: "ma"
      period: 20
    - type: "recent_low"
      lookback: 10
    - type: "platform"
      lookback: 20

# ---- 持仓评分 → 操作建议 ----
hold_action:
  thresholds:
    key_hold: 80        # 重点持有
    continue_hold: 65   # 继续持有
    watch: 50           # 观察
    reduce: 35          # 减仓
    active_reduce: 20   # 主动减仓
    clear: 0            # 清仓观察

# ---- 候选股筛选 ----
candidate:
  min_stock_score: 70
  min_entry_score: 55
  max_crowding: 80
  max_candidates: 20
  # 追高惩罚
  chase_penalty:
    pct_3d_threshold: 0.20
    pct_5d_threshold: 0.30
    pct_20d_threshold: 0.50
    penalty_factor: 0.70
