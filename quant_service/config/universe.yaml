# ============================================================
# A股量化复盘与交易决策系统 V3.0 — 股票池配置
# ============================================================

# 默认包含市场
include_markets:
  - "sh"       # 沪市主板
  - "sz"       # 深市主板
  - "cy"       # 创业板

# 排除规则
exclude:
  # 排除的交易所/板块
  boards:
    - "bj"     # 北交所
    - "kc"     # 科创板 688

  # 排除的股票名称关键词
  name_keywords:
    - "ST"
    - "*ST"
    - "退市"
    - "退"

  # 排除的代码前缀
  code_prefixes:
    - "688"    # 科创板
    - "689"    # 科创板
    - "8"      # 北交所
    - "4"      # 北交所/三板

  # 最少上市天数（排除次新股）
  min_listing_days: 60

  # 长期停牌阈值（天）
  max_suspend_days: 20

# 产业链映射（可持续扩展）
industry_chains:
  AI算力:
    - GPU
    - ASIC
    - PCB
    - CCL覆铜板
    - 光模块
    - CPO
    - 连接器
    - 液冷
    - 电源
    - 服务器
    - AI芯片
    - 算力租赁

  半导体:
    - 芯片设计
    - 晶圆代工
    - 封装测试
    - 半导体设备
    - 半导体材料
    - EDA
    - IP

  消费电子:
    - 手机
    - 平板
    - 可穿戴
    - XR
    - 消费芯片

  机器人:
    - 减速器
    - 伺服电机
    - 控制器
    - 传感器
    - 丝杠
    - 灵巧手
    - 机器视觉

  新能源:
    - 锂电池
    - 光伏
    - 风电
    - 储能
    - 充电桩

  军工:
    - 航空发动机
    - 军工电子
    - 导弹
    - 卫星
    - 无人机
