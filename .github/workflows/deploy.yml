name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/www/wwwroot/chenyc' }}
      DEPLOY_BRANCH: main
      PM2_APP_NAME: ${{ secrets.PM2_APP_NAME }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "${{ secrets.DEPLOY_SSH_KEY }}"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${{ secrets.DEPLOY_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p "$DEPLOY_PORT" "$DEPLOY_HOST" >> ~/.ssh/known_hosts

      - name: Pack source
        run: |
          set -euo pipefail
          tar \
            --exclude='./.git' \
            --exclude='./node_modules' \
            --exclude='./artifacts' \
            -czf /tmp/chenyc-release.tar.gz .
          test -s /tmp/chenyc-release.tar.gz
          ls -lh /tmp/chenyc-release.tar.gz

      - name: Upload and deploy
        run: |
          set -euo pipefail
          scp -i ~/.ssh/deploy_key -P "$DEPLOY_PORT" /tmp/chenyc-release.tar.gz "$DEPLOY_USER@$DEPLOY_HOST:/tmp/chenyc-release.tar.gz"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' PM2_APP_NAME='$PM2_APP_NAME' bash -s" <<'REMOTE'
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm use 22 >/dev/null || nvm use node >/dev/null
          fi
          export PATH="$HOME/.nvm/current/bin:$PATH"

          command -v node
          command -v npm
          node --version
          npm --version

          test -s /tmp/chenyc-release.tar.gz

          mkdir -p "$DEPLOY_PATH"
          cd "$DEPLOY_PATH"

          echo "Cleaning old source files..."
          rm -rf src public content docs .github .next
          rm -f AGENTS.md CLAUDE.md README.md eslint.config.mjs next-env.d.ts next.config.ts package.json package-lock.json postcss.config.mjs tsconfig.json

          echo "Extracting release..."
          tar -xzf /tmp/chenyc-release.tar.gz -C "$DEPLOY_PATH"
          
          echo "Installing dependencies..."
          npm ci --no-audit --no-fund

          echo "Restarting app..."
          if [ -n "${PM2_APP_NAME:-}" ]; then
            npx --yes pm2 restart "$PM2_APP_NAME" || true
          else
            npx --yes pm2 restart all || true
          fi
          npx --yes pm2 save || true
          rm -f /tmp/chenyc-release.tar.gz
          REMOTE
