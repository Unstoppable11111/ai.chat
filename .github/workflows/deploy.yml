name: Deploy

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  build:
    name: Build check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm test

      - name: Lint
        run: npm run lint

  deploy:
    name: Deploy to server
    runs-on: ubuntu-latest
    needs: build

    env:
      DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
      DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
      DEPLOY_PORT: ${{ secrets.DEPLOY_PORT || '22' }}
      DEPLOY_PATH: ${{ secrets.DEPLOY_PATH || '/www/wwwroot/chenyc' }}
      DEPLOY_KNOWN_HOSTS: ${{ secrets.DEPLOY_KNOWN_HOSTS }}
      DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
      PM2_APP_NAME: ${{ secrets.PM2_APP_NAME || 'chenyc' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Prepare SSH
        run: |
          set -euo pipefail
          test -n "$DEPLOY_HOST"
          test -n "$DEPLOY_USER"
          test -n "$DEPLOY_SSH_KEY"
          test -n "$DEPLOY_KNOWN_HOSTS"
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          printf '%s\n' "$DEPLOY_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Upload and deploy
        run: |
          set -euo pipefail
          [[ "$DEPLOY_PATH" =~ ^/[A-Za-z0-9_./-]+$ && "$DEPLOY_PATH" != / ]]
          [[ "$DEPLOY_PORT" =~ ^[0-9]+$ ]]
          incoming="/tmp/chenyc-incoming-$GITHUB_RUN_ID-$GITHUB_RUN_ATTEMPT"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$incoming' && command -v rsync"
          rsync -rclz \
            --copy-dest="$DEPLOY_PATH/current" \
            --exclude='/.git/' \
            --exclude='/node_modules/' \
            --exclude='/artifacts/' \
            --exclude='/.env*' \
            --exclude='/.runtime/' \
            --exclude='/.next/cache/' \
            --exclude='/.next/dev/' \
            -e "ssh -i $HOME/.ssh/deploy_key -p $DEPLOY_PORT" \
            ./ "$DEPLOY_USER@$DEPLOY_HOST:$incoming/"
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" "tar -czf /tmp/chenyc-release.tar.gz -C '$incoming' ."
          ssh -i ~/.ssh/deploy_key -p "$DEPLOY_PORT" "$DEPLOY_USER@$DEPLOY_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH' PM2_APP_NAME='$PM2_APP_NAME' bash -s" <<'REMOTE'
          set -euo pipefail

          export NVM_DIR="$HOME/.nvm"
          if [ -s "$NVM_DIR/nvm.sh" ]; then
            . "$NVM_DIR/nvm.sh"
            nvm use 22 >/dev/null || nvm use node >/dev/null
          fi
          export PATH="$HOME/.nvm/current/bin:$PATH"
          if ! command -v pm2 >/dev/null; then
            pm2_binary="$(find "$NVM_DIR/versions/node" -path '*/bin/pm2' -type l | sort | tail -1)"
            test -n "$pm2_binary"
            export PATH="$PATH:$(dirname "$pm2_binary")"
          fi

          command -v node
          command -v npm
          node --version
          npm --version

          test -s /tmp/chenyc-release.tar.gz

          staging="$(mktemp -d)"
          tar -xzf /tmp/chenyc-release.tar.gz -C "$staging" ./scripts/deploy-release.sh
          export RELEASE_ARCHIVE=/tmp/chenyc-release.tar.gz
          export DEPLOY_PATH PM2_APP_NAME
          bash "$staging/scripts/deploy-release.sh"
          REMOTE
