<svg width="1200" height="675" viewBox="0 0 1200 675" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad_enterprise-rag.svg" cx="50%" cy="40%" r="80%" fx="30%" fy="30%">
      <stop offset="0%" stop-color="#4338ca" stop-opacity="0.5" />
      <stop offset="60%" stop-color="#312e81" stop-opacity="0.3" />
      <stop offset="100%" stop-color="#0f172a" />
    </radialGradient>
    <linearGradient id="lineGrad_enterprise-rag.svg" x1="0" y1="0" x2="1200" y2="675" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#6366f1" stop-opacity="0.6"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#6366f1" stop-opacity="0.05"/>
    </linearGradient>
    <filter id="glow_enterprise-rag.svg" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="60" result="blur" />
    </filter>
  </defs>

  <!-- Dark Base Background -->
  <rect width="1200" height="675" fill="#090d16"/>
  <rect width="1200" height="675" fill="url(#bgGrad_enterprise-rag.svg)"/>

  <!-- High Tech Grid Background -->
  <g opacity="0.12" stroke="#ffffff" stroke-width="1">
    <line x1="0" y1="75" x2="1200" y2="75"/>
    <line x1="0" y1="175" x2="1200" y2="175"/>
    <line x1="0" y1="275" x2="1200" y2="275"/>
    <line x1="0" y1="375" x2="1200" y2="375"/>
    <line x1="0" y1="475" x2="1200" y2="475"/>
    <line x1="0" y1="575" x2="1200" y2="575"/>
    
    <line x1="150" y1="0" x2="150" y2="675"/>
    <line x1="300" y1="0" x2="300" y2="675"/>
    <line x1="450" y1="0" x2="450" y2="675"/>
    <line x1="600" y1="0" x2="600" y2="675"/>
    <line x1="750" y1="0" x2="750" y2="675"/>
    <line x1="900" y1="0" x2="900" y2="675"/>
    <line x1="1050" y1="0" x2="1050" y2="675"/>
  </g>

  <!-- Atmospheric Glow Aura -->
  <circle cx="850" cy="280" r="220" fill="#6366f1" opacity="0.35" filter="url(#glow_enterprise-rag.svg)"/>
  <circle cx="350" cy="450" r="180" fill="#4338ca" opacity="0.2" filter="url(#glow_enterprise-rag.svg)"/>

  <!-- Abstract Geometric Schematic (Tech Art) -->
  <g stroke="url(#lineGrad_enterprise-rag.svg)" stroke-width="2" fill="none">
    <rect x="720" y="160" width="340" height="340" rx="24" stroke-dasharray="8 8" opacity="0.4"/>
    <rect x="760" y="200" width="260" height="260" rx="16" opacity="0.7"/>
    <circle cx="890" cy="330" r="80" stroke="#6366f1" stroke-width="2.5" opacity="0.9"/>
    <circle cx="890" cy="330" r="130" stroke="#6366f1" stroke-width="1" opacity="0.3"/>
    <circle cx="890" cy="330" r="12" fill="#6366f1"/>
    
    <!-- Dynamic Topology Nodes -->
    <circle cx="760" cy="200" r="6" fill="#ffffff"/>
    <circle cx="1020" cy="200" r="6" fill="#6366f1"/>
    <circle cx="760" cy="460" r="6" fill="#6366f1"/>
    <circle cx="1020" cy="460" r="6" fill="#ffffff"/>

    <line x1="760" y1="200" x2="890" y2="330" stroke-width="1.5" opacity="0.5"/>
    <line x1="1020" y1="200" x2="890" y2="330" stroke-width="1.5" opacity="0.5"/>
    <line x1="760" y1="460" x2="890" y2="330" stroke-width="1.5" opacity="0.5"/>
    <line x1="1020" y1="460" x2="890" y2="330" stroke-width="1.5" opacity="0.5"/>
  </g>

  <!-- Left Content Group -->
  <!-- Badge Capsule -->
  <rect x="90" y="150" width="168" height="38" rx="19" fill="#0f172a" stroke="#6366f1" stroke-width="1.5"/>
  <circle cx="110" cy="169" r="4" fill="#6366f1"/>
  <text x="124" y="174" fill="#f8fafc" font-family="system-ui, -apple-system, sans-serif" font-size="13" font-weight="700" letter-spacing="0.16em">RAG & SEARCH</text>

  <!-- Main Headline -->
  <text x="90" y="270" fill="#ffffff" font-family="system-ui, -apple-system, sans-serif" font-size="52" font-weight="800" letter-spacing="-0.03em">Enterprise RAG Matrix</text>
  
  <!-- Subtitle / Architecture Notes -->
  <text x="90" y="325" fill="#94a3b8" font-family="system-ui, -apple-system, sans-serif" font-size="20" font-weight="400" letter-spacing="-0.01em">Hybrid Search, Dense Vectors & Cross-Encoder Rerank</text>

  <!-- Bottom Tech Specs Metadata -->
  <g font-family="ui-monospace, monospace" font-size="13" fill="#64748b" letter-spacing="0.1em">
    <text x="90" y="520">CORE ENGINE: DEEP_STUDIO_V2</text>
    <text x="90" y="545">STATUS: PRODUCTION_VERIFIED</text>
  </g>

  <!-- Subtle Outer Border -->
  <rect x="1" y="1" width="1198" height="673" rx="0" stroke="#ffffff" stroke-opacity="0.08" fill="none"/>
</svg>