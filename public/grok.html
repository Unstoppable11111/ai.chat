<!DOCTYPE html>
<html>

<head>
    <meta charset="UTF-8">
    <title>鹈鹕骑车</title>
    <style>
        body {
            margin: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            background: #87CEEB
        }

        svg {
            width: 90vmin
        }
    </style>
</head>

<body>
    <svg viewBox="0 0 400 300">
        <!-- 地面 -->
        <rect y="250" width="400" height="50" fill="#90EE90" />
        <!-- 自行车 -->
        <g id="bike">
            <circle cx="120" cy="220" r="35" fill="none" stroke="#333" stroke-width="4" />
            <circle cx="280" cy="220" r="35" fill="none" stroke="#333" stroke-width="4" />
            <line x1="120" y1="220" x2="280" y2="220" stroke="#c00" stroke-width="6" />
            <line x1="200" y1="220" x2="200" y2="160" stroke="#c00" stroke-width="5" />
            <line x1="200" y1="160" x2="150" y2="140" stroke="#c00" stroke-width="5" />
            <line x1="200" y1="160" x2="250" y2="140" stroke="#c00" stroke-width="5" />
        </g>
        <!-- 鹈鹕 -->
        <g id="pelican">
            <ellipse cx="200" cy="130" rx="40" ry="25" fill="#fff" stroke="#333" />
            <circle cx="230" cy="110" r="18" fill="#fff" stroke="#333" />
            <path d="M245 110 Q280 100 290 120 Q270 140 245 120" fill="#ffa500" />
            <ellipse cx="220" cy="120" rx="12" ry="8" fill="#ff69b4" />
            <circle cx="235" cy="105" r="3" fill="#000" />
            <path d="M180 130 Q160 100 140 120" fill="#eee" stroke="#333" />
            <path d="M160 150 L150 200 M180 150 L190 200" stroke="#ffa500" stroke-width="4" />
        </g>
        <animateTransform xlink:href="#bike" attributeName="transform" type="translate" values="0 0; -5 0; 0 0"
            dur="0.4s" repeatCount="indefinite" />
        <animateTransform xlink:href="#pelican" attributeName="transform" type="translate" values="0 0; 0 -3; 0 0"
            dur="0.4s" repeatCount="indefinite" />
    </svg>
</body>

</html>
