<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>上帝之眼 · GOD'S EYE</title>
  <link rel="icon" type="image/svg+xml" href="/apps/gods-eye/logo.svg">
  <link rel="stylesheet" href="/apps/gods-eye/cesium/Widgets/widgets.css">
  <script src="/apps/gods-eye/cesium/Cesium.js"></script>
  <style>
    /* ── Reset & Base ─────────────────────────────────── */
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; height: 100%; overflow: hidden; background: #0a0e1a; color: #c8d6e5; font-family: 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif; }

    /* ── Cesium container ─────────────────────────────── */
    #cesiumContainer { width: 100%; height: 100%; }
    /* Hide Cesium default UI chrome */
    .cesium-viewer-toolbar,
    .cesium-viewer-animationContainer,
    .cesium-viewer-timelineContainer,
    .cesium-viewer-fullscreenContainer,
    .cesium-viewer-vrContainer,
    .cesium-viewer-geocoderContainer,
    .cesium-viewer-infoBoxContainer,
    .cesium-viewer-selectionIndicatorContainer,
    .cesium-viewer-bottom { display: none !important; }
    .cesium-widget-credits { opacity: 0.35; font-size: 10px !important; pointer-events: none; }

    /* ── CSS Variables ─────────────────────────────────── */
    :root {
      --cyan: #00f0ff;
      --cyan-dim: rgba(0, 240, 255, 0.15);
      --cyan-mid: rgba(0, 240, 255, 0.4);
      --bg-panel: rgba(8, 14, 28, 0.88);
      --bg-hover: rgba(0, 240, 255, 0.08);
      --border: rgba(0, 240, 255, 0.2);
      --text-main: #e0e8f0;
      --text-dim: #7a8fa6;
      --radius: 8px;
      --safe-bottom: env(safe-area-inset-bottom, 0px);
    }

    /* ── Title Bar ─────────────────────────────────────── */
    #title-bar {
      position: absolute; top: 16px; left: 16px; z-index: 100;
      display: flex; align-items: center; gap: 12px;
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 10px 18px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      user-select: none;
    }
    #title-bar img { width: 28px; height: 28px; filter: drop-shadow(0 0 6px var(--cyan)); }
    #title-bar h1 { font-size: 15px; font-weight: 600; letter-spacing: 1px; color: var(--text-main); }
    #title-bar h1 span { color: var(--cyan); font-weight: 700; }
    #title-bar .subtitle { font-size: 10px; color: var(--text-dim); letter-spacing: 2px; margin-top: 1px; }

    /* ── Telemetry HUD (bottom-left) ──────────────────── */
    #telemetry {
      position: absolute; bottom: 16px; left: 16px; z-index: 100;
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 12px 16px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      font-size: 12px; line-height: 1.8; min-width: 220px;
      padding-bottom: calc(12px + var(--safe-bottom));
    }
    #telemetry .label { color: var(--text-dim); font-size: 10px; letter-spacing: 1.5px; text-transform: uppercase; }
    #telemetry .value { color: var(--cyan); font-weight: 600; font-variant-numeric: tabular-nums; }
    #telemetry .row { display: flex; justify-content: space-between; align-items: center; }

    /* ── Layer Switcher (top-right) ────────────────────── */
    #layer-panel {
      position: absolute; top: 16px; right: 16px; z-index: 100;
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      display: flex; flex-direction: column; gap: 4px;
    }
    .layer-btn {
      background: transparent; border: 1px solid transparent; color: var(--text-dim);
      padding: 7px 14px; border-radius: 6px; cursor: pointer; font-size: 12px;
      text-align: left; transition: all 0.2s; white-space: nowrap;
    }
    .layer-btn:hover { background: var(--bg-hover); color: var(--text-main); }
    .layer-btn.active { background: var(--cyan-dim); border-color: var(--cyan-mid); color: var(--cyan); font-weight: 600; }

    /* ── Camera Controls (right side) ─────────────────── */
    #cam-controls {
      position: absolute; right: 16px; top: 50%; transform: translateY(-50%);
      z-index: 100; display: flex; flex-direction: column; gap: 6px;
    }
    .cam-btn {
      width: 40px; height: 40px; border-radius: 50%;
      background: var(--bg-panel); border: 1px solid var(--border);
      color: var(--text-dim); font-size: 16px; cursor: pointer;
      display: flex; align-items: center; justify-content: center;
      transition: all 0.2s; backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    .cam-btn:hover { border-color: var(--cyan); color: var(--cyan); background: var(--cyan-dim); }
    .cam-btn.active { border-color: var(--cyan); color: var(--cyan); }

    /* ── Search Bar (top-center) ──────────────────────── */
    #search-bar {
      position: absolute; top: 16px; left: 50%; transform: translateX(-50%);
      z-index: 100; display: flex; align-items: center; gap: 0;
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: var(--radius); overflow: hidden;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      max-width: 400px; width: calc(100% - 300px);
    }
    #search-input {
      flex: 1; background: transparent; border: none; color: var(--text-main);
      padding: 10px 14px; font-size: 13px; outline: none; min-width: 0;
    }
    #search-input::placeholder { color: var(--text-dim); }
    #search-btn {
      background: transparent; border: none; border-left: 1px solid var(--border);
      color: var(--text-dim); padding: 10px 14px; cursor: pointer; font-size: 14px;
      transition: color 0.2s;
    }
    #search-btn:hover { color: var(--cyan); }

    /* Search suggestions dropdown */
    #search-results {
      position: absolute; top: 100%; left: 0; right: 0;
      background: var(--bg-panel); border: 1px solid var(--border);
      border-top: none; border-radius: 0 0 var(--radius) var(--radius);
      max-height: 240px; overflow-y: auto; display: none;
    }
    #search-results.show { display: block; }
    .search-item {
      padding: 10px 14px; font-size: 12px; color: var(--text-main);
      cursor: pointer; border-bottom: 1px solid rgba(255,255,255,0.04);
      transition: background 0.15s;
    }
    .search-item:hover { background: var(--bg-hover); }
    .search-item:last-child { border-bottom: none; }
    .search-item small { color: var(--text-dim); margin-left: 6px; }

    /* ── Quick Location Chips (below search on mobile, beside search on desktop) ── */
    #quick-locations {
      position: absolute; top: 62px; left: 50%; transform: translateX(-50%);
      z-index: 99; display: flex; gap: 6px; flex-wrap: wrap; justify-content: center;
      max-width: 500px;
    }
    .loc-chip {
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: 20px; padding: 5px 12px; color: var(--text-dim);
      font-size: 11px; cursor: pointer; transition: all 0.2s;
      backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px);
      white-space: nowrap;
    }
    .loc-chip:hover { border-color: var(--cyan); color: var(--cyan); }

    /* ── Loading Overlay ──────────────────────────────── */
    #loading-overlay {
      position: fixed; inset: 0; z-index: 9999;
      background: #0a0e1a; display: flex; flex-direction: column;
      align-items: center; justify-content: center; gap: 20px;
      transition: opacity 0.6s;
    }
    #loading-overlay.hidden { opacity: 0; pointer-events: none; }
    .loading-ring {
      width: 60px; height: 60px; border: 2px solid var(--border);
      border-top-color: var(--cyan); border-radius: 50%;
      animation: spin 1s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .loading-text { color: var(--cyan); font-size: 14px; letter-spacing: 3px; }
    .loading-sub { color: var(--text-dim); font-size: 11px; letter-spacing: 1px; }

    /* ── Lighting info badge ──────────────────────────── */
    #lighting-badge {
      position: absolute; bottom: 16px; right: 16px; z-index: 100;
      background: var(--bg-panel); border: 1px solid var(--border);
      border-radius: var(--radius); padding: 8px 14px;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
      font-size: 11px; color: var(--text-dim); display: flex; align-items: center; gap: 8px;
      padding-bottom: calc(8px + var(--safe-bottom));
    }
    #lighting-badge .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--cyan); box-shadow: 0 0 6px var(--cyan); }

    /* ── Toast ─────────────────────────────────────────── */
    #toast {
      position: fixed; bottom: 80px; left: 50%; transform: translateX(-50%) translateY(20px);
      z-index: 9999; background: var(--bg-panel); border: 1px solid var(--cyan-mid);
      border-radius: var(--radius); padding: 10px 20px;
      color: var(--cyan); font-size: 13px; opacity: 0; pointer-events: none;
      transition: opacity 0.3s, transform 0.3s;
      backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); pointer-events: auto; }

    /* ── Mobile Responsive ─────────────────────────────── */
    @media (max-width: 768px) {
      #title-bar { top: 8px; left: 8px; padding: 8px 12px; gap: 8px; }
      #title-bar h1 { font-size: 13px; }
      #title-bar .subtitle { display: none; }
      #title-bar img { width: 22px; height: 22px; }

      #search-bar { top: 8px; width: calc(100% - 140px); max-width: none; left: auto; right: 8px; transform: none; }
      #quick-locations { top: 52px; left: 8px; right: 8px; transform: none; max-width: none; }

      #layer-panel { top: auto; bottom: 60px; right: 8px; flex-direction: row; flex-wrap: wrap; justify-content: flex-end; max-width: calc(100% - 16px); padding-bottom: calc(8px + var(--safe-bottom)); }
      .layer-btn { padding: 6px 10px; font-size: 11px; }

      #cam-controls { right: 8px; top: auto; bottom: 130px; transform: none; flex-direction: row; padding-bottom: var(--safe-bottom); }
      .cam-btn { width: 36px; height: 36px; font-size: 14px; }

      #telemetry { bottom: 8px; left: 8px; right: 8px; min-width: auto; font-size: 11px; padding: 10px 12px; padding-bottom: calc(10px + var(--safe-bottom)); }

      #lighting-badge { display: none; }
    }

    @media (max-width: 480px) {
      #title-bar h1 span { display: none; }
      .loc-chip { font-size: 10px; padding: 4px 8px; }
      #search-bar { width: calc(100% - 120px); }
    }
  </style>
</head>
<body>
  <!-- Loading Overlay -->
  <div id="loading-overlay">
    <div class="loading-ring"></div>
    <div class="loading-text">GOD'S EYE</div>
    <div class="loading-sub">正在初始化三维地球引擎...</div>
  </div>

  <!-- Cesium Globe -->
  <div id="cesiumContainer"></div>

  <!-- Title Bar -->
  <div id="title-bar">
    <img src="/apps/gods-eye/logo.svg" alt="">
    <div>
      <h1>上帝之眼 <span>GOD'S EYE</span></h1>
      <div class="subtitle">全球空间态势感知系统</div>
    </div>
  </div>

  <!-- Search Bar -->
  <div id="search-bar">
    <input id="search-input" type="text" placeholder="搜索全球地点..." autocomplete="off" spellcheck="false">
    <button id="search-btn" title="搜索">🔍</button>
    <div id="search-results"></div>
  </div>

  <!-- Quick Location Chips -->
  <div id="quick-locations">
    <button class="loc-chip" data-lon="116.3912" data-lat="39.9075" data-alt="2500" data-name="北京">北京</button>
    <button class="loc-chip" data-lon="121.4737" data-lat="31.2304" data-alt="2500" data-name="上海">上海</button>
    <button class="loc-chip" data-lon="114.0579" data-lat="22.5431" data-alt="2500" data-name="深圳">深圳</button>
    <button class="loc-chip" data-lon="-73.9857" data-lat="40.7484" data-alt="3000" data-name="纽约">纽约</button>
    <button class="loc-chip" data-lon="139.6917" data-lat="35.6895" data-alt="2500" data-name="东京">东京</button>
    <button class="loc-chip" data-lon="-0.1276" data-lat="51.5074" data-alt="2500" data-name="伦敦">伦敦</button>
    <button class="loc-chip" data-lon="2.3522" data-lat="48.8566" data-alt="2500" data-name="巴黎">巴黎</button>
  </div>

  <!-- Layer Switcher -->
  <div id="layer-panel">
    <button class="layer-btn active" data-layer="bing" title="微软必应卫星影像 (4K)">🛰 必应卫星</button>
    <button class="layer-btn" data-layer="esri" title="Esri 世界影像 (Maxar)">🌍 Esri 影像</button>
    <button class="layer-btn" data-layer="amap" title="高德卫星影像 (国内CDN)">🇨🇳 高德卫星</button>
    <button class="layer-btn" data-layer="tianditu" title="天地图卫星影像">🗺 天地图</button>
  </div>

  <!-- Camera Controls -->
  <div id="cam-controls">
    <button class="cam-btn" id="btn-home" title="全景地球">🌐</button>
    <button class="cam-btn" id="btn-tilt" title="切换俯视/倾斜">⟨⟩</button>
    <button class="cam-btn" id="btn-north" title="朝北复位">N</button>
    <button class="cam-btn" id="btn-light" title="真实光照">☀</button>
  </div>

  <!-- Telemetry HUD -->
  <div id="telemetry">
    <div class="row"><span class="label">纬度 LAT</span> <span class="value" id="t-lat">--</span></div>
    <div class="row"><span class="label">经度 LON</span> <span class="value" id="t-lon">--</span></div>
    <div class="row"><span class="label">高度 ALT</span> <span class="value" id="t-alt">--</span></div>
    <div class="row"><span class="label">航向 HDG</span> <span class="value" id="t-hdg">--</span></div>
  </div>

  <!-- Lighting Badge -->
  <div id="lighting-badge">
    <div class="dot"></div>
    <span id="badge-text">标准渲染</span>
  </div>

  <!-- Toast -->
  <div id="toast"></div>

  <script>
    /* ================================================================
       GOD'S EYE — Lightweight Cesium Globe Viewer
       High-resolution satellite imagery with military cyberpunk UI
       ================================================================ */

    // ── Suppress Cesium Ion warnings ────────────────────
    Cesium.Ion.defaultAccessToken = '';

    // ── QuadKey helper for Bing tiles ───────────────────
    function tileXYToQuadKey(x, y, level) {
      var key = '';
      for (var i = level; i > 0; i--) {
        var digit = 0;
        var mask = 1 << (i - 1);
        if ((x & mask) !== 0) digit += 1;
        if ((y & mask) !== 0) digit += 2;
        key += digit.toString();
      }
      return key;
    }

    // ── Imagery Providers ───────────────────────────────
    var imageryProviders = {
      bing: function() {
        return new Cesium.UrlTemplateImageryProvider({
          url: 'https://ecn.t{s}.tiles.virtualearth.net/tiles/a{quadkey}.jpeg?g=14205&mkt=zh-cn',
          subdomains: ['0', '1', '2', '3'],
          maximumLevel: 19,
          credit: new Cesium.Credit('Bing Maps © Microsoft'),
          customTags: {
            quadkey: function(imageryProvider, x, y, level) {
              return tileXYToQuadKey(x, y, level);
            }
          }
        });
      },
      esri: function() {
        return new Cesium.UrlTemplateImageryProvider({
          url: 'https://server.arcgisonline.com/ArcGIS/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}',
          maximumLevel: 19,
          credit: new Cesium.Credit('Esri World Imagery © Maxar')
        });
      },
      amap: function() {
        return new Cesium.UrlTemplateImageryProvider({
          url: 'https://webst0{s}.is.autonavi.com/appmaptile?style=6&x={x}&y={y}&z={z}',
          subdomains: ['1', '2', '3', '4'],
          maximumLevel: 18,
          credit: new Cesium.Credit('高德地图 © AutoNavi')
        });
      },
      tianditu: function() {
        return new Cesium.UrlTemplateImageryProvider({
          url: 'https://t{s}.tianditu.gov.cn/img_w/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&LAYER=img&STYLE=default&TILEMATRIXSET=w&FORMAT=tiles&TILECOL={x}&TILEROW={y}&TILEMATRIX={z}&tk=95f2f107535178b4c8672aa7423df207',
          subdomains: ['0', '1', '2', '3', '4', '5', '6', '7'],
          maximumLevel: 18,
          credit: new Cesium.Credit('天地图 © 国家地理信息公共服务平台')
        });
      }
    };

    // ── State ───────────────────────────────────────────
    var currentLayer = 'bing';
    var lightingEnabled = false;
    var viewer, scene, globe;

    // ── Initialize Viewer ───────────────────────────────
    function initViewer() {
      viewer = new Cesium.Viewer('cesiumContainer', {
        baseLayer: false,
        timeline: false,
        animation: false,
        geocoder: false,
        homeButton: false,
        sceneModePicker: false,
        baseLayerPicker: false,
        navigationHelpButton: false,
        fullscreenButton: false,
        vrButton: false,
        infoBox: false,
        selectionIndicator: false,
        shadows: false,
        shouldAnimate: false,
        msaaSamples: 4,
        useBrowserRecommendedResolution: false,
        requestRenderMode: false
      });

      scene = viewer.scene;
      globe = scene.globe;

      // ── HiDPI / Retina rendering ──────────────────────
      var dpr = window.devicePixelRatio || 1;
      viewer.resolutionScale = Math.min(dpr, 2.0);

      // ── Globe quality settings ────────────────────────
      globe.maximumScreenSpaceError = 1.5;
      globe.preloadAncestors = true;
      globe.preloadSiblings = true;
      globe.tileCacheSize = 200;

      // ── Atmosphere & sky ──────────────────────────────
      scene.skyAtmosphere.show = true;
      scene.fog.enabled = true;
      scene.fog.density = 2.0e-4;
      scene.fog.minimumBrightness = 0.03;
      globe.enableLighting = false;
      globe.showGroundAtmosphere = true;

      // ── Anti-aliasing ─────────────────────────────────
      if (scene.postProcessStages && scene.postProcessStages.fxaa) {
        scene.postProcessStages.fxaa.enabled = true;
      }

      // ── Background color (space) ──────────────────────
      scene.backgroundColor = Cesium.Color.fromCssColorString('#0a0e1a');

      // ── Add default imagery layer ─────────────────────
      addImageryLayer('bing');

      // ── Initial camera: China from space ──────────────
      viewer.camera.setView({
        destination: Cesium.Cartesian3.fromDegrees(104.0, 35.0, 8000000),
        orientation: { heading: 0, pitch: -Math.PI / 2, roll: 0 }
      });

      // ── Update telemetry on camera move ───────────────
      scene.camera.changed.addEventListener(updateTelemetry);
      scene.camera.percentageChanged = 0.01;

      // ── Remove loading ────────────────────────────────
      setTimeout(function() {
        document.getElementById('loading-overlay').classList.add('hidden');
        setTimeout(function() {
          var overlay = document.getElementById('loading-overlay');
          if (overlay) overlay.remove();
        }, 700);
      }, 1500);
    }

    // ── Add / Switch Imagery Layer ──────────────────────
    function addImageryLayer(layerKey) {
      // Remove all existing layers
      viewer.imageryLayers.removeAll();
      // Add new
      var provider = imageryProviders[layerKey]();
      viewer.imageryLayers.addImageryProvider(provider);
      currentLayer = layerKey;
    }

    // ── Telemetry Update ────────────────────────────────
    function updateTelemetry() {
      var camera = viewer.camera;
      var carto = camera.positionCartographic;
      var lat = Cesium.Math.toDegrees(carto.latitude);
      var lon = Cesium.Math.toDegrees(carto.longitude);
      var alt = carto.height;
      var heading = Cesium.Math.toDegrees(camera.heading);

      document.getElementById('t-lat').textContent = lat.toFixed(4) + '°';
      document.getElementById('t-lon').textContent = lon.toFixed(4) + '°';
      document.getElementById('t-hdg').textContent = heading.toFixed(1) + '°';

      // Format altitude
      if (alt > 1000000) {
        document.getElementById('t-alt').textContent = (alt / 1000).toFixed(0) + ' km';
      } else if (alt > 1000) {
        document.getElementById('t-alt').textContent = (alt / 1000).toFixed(1) + ' km';
      } else {
        document.getElementById('t-alt').textContent = alt.toFixed(0) + ' m';
      }
    }

    // ── Toast ───────────────────────────────────────────
    var toastTimer = null;
    function showToast(msg) {
      var el = document.getElementById('toast');
      el.textContent = msg;
      el.classList.add('show');
      clearTimeout(toastTimer);
      toastTimer = setTimeout(function() { el.classList.remove('show'); }, 2500);
    }

    // ── Fly To Location ─────────────────────────────────
    function flyTo(lon, lat, alt, name) {
      viewer.camera.flyTo({
        destination: Cesium.Cartesian3.fromDegrees(lon, lat, alt),
        orientation: {
          heading: 0,
          pitch: Cesium.Math.toRadians(-45),
          roll: 0
        },
        duration: 2.0
      });
      if (name) showToast('📍 飞向 ' + name);
    }

    // ── Search (Photon geocoder — free, no API key) ─────
    var searchTimeout = null;
    function doSearch(query) {
      if (!query || query.length < 2) {
        document.getElementById('search-results').classList.remove('show');
        return;
      }

      // Try parsing as coordinates first (lat, lon or lon, lat)
      var coordMatch = query.match(/^\s*(-?\d+\.?\d*)\s*[,，\s]+\s*(-?\d+\.?\d*)\s*$/);
      if (coordMatch) {
        var a = parseFloat(coordMatch[1]);
        var b = parseFloat(coordMatch[2]);
        // Determine which is lat/lon based on range
        var lat, lon;
        if (Math.abs(a) <= 90 && Math.abs(b) <= 180) { lat = a; lon = b; }
        else if (Math.abs(b) <= 90 && Math.abs(a) <= 180) { lat = b; lon = a; }
        else { lat = a; lon = b; }
        flyTo(lon, lat, 2000, lat.toFixed(4) + ', ' + lon.toFixed(4));
        document.getElementById('search-results').classList.remove('show');
        return;
      }

      // Use Photon geocoder (OpenStreetMap-based, free)
      fetch('https://photon.komoot.io/api/?q=' + encodeURIComponent(query) + '&limit=6&lang=zh')
        .then(function(r) { return r.json(); })
        .then(function(data) {
          var results = document.getElementById('search-results');
          results.innerHTML = '';
          if (!data.features || data.features.length === 0) {
            results.innerHTML = '<div class="search-item" style="color:var(--text-dim)">未找到结果</div>';
            results.classList.add('show');
            return;
          }
          data.features.forEach(function(f) {
            var props = f.properties;
            var name = props.name || props.city || props.county || '';
            var region = [props.state, props.country].filter(Boolean).join(', ');
            var coords = f.geometry.coordinates;
            var div = document.createElement('div');
            div.className = 'search-item';
            div.innerHTML = name + (region ? '<small>' + region + '</small>' : '');
            div.addEventListener('click', function() {
              flyTo(coords[0], coords[1], 2500, name);
              results.classList.remove('show');
              document.getElementById('search-input').value = name;
            });
            results.appendChild(div);
          });
          results.classList.add('show');
        })
        .catch(function() {
          // If Photon fails (e.g., in China), fail silently
        });
    }

    // ── Event Bindings ──────────────────────────────────
    function bindEvents() {
      // Layer switching
      document.querySelectorAll('.layer-btn').forEach(function(btn) {
        btn.addEventListener('click', function() {
          var layer = this.dataset.layer;
          if (layer === currentLayer) return;
          document.querySelectorAll('.layer-btn').forEach(function(b) { b.classList.remove('active'); });
          this.classList.add('active');
          addImageryLayer(layer);
          var names = { bing: '必应卫星 4K', esri: 'Esri 世界影像', amap: '高德卫星', tianditu: '天地图' };
          showToast('🛰 已切换: ' + names[layer]);
        });
      });

      // Quick locations
      document.querySelectorAll('.loc-chip').forEach(function(chip) {
        chip.addEventListener('click', function() {
          var lon = parseFloat(this.dataset.lon);
          var lat = parseFloat(this.dataset.lat);
          var alt = parseFloat(this.dataset.alt);
          var name = this.dataset.name;
          flyTo(lon, lat, alt, name);
        });
      });

      // Camera controls
      document.getElementById('btn-home').addEventListener('click', function() {
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromDegrees(104.0, 35.0, 8000000),
          orientation: { heading: 0, pitch: -Math.PI / 2, roll: 0 },
          duration: 2.0
        });
        showToast('🌐 全景地球');
      });

      document.getElementById('btn-tilt').addEventListener('click', function() {
        var camera = viewer.camera;
        var currentPitch = Cesium.Math.toDegrees(camera.pitch);
        var targetPitch = currentPitch > -50 ? -90 : -35;
        var carto = camera.positionCartographic;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromRadians(carto.longitude, carto.latitude, carto.height),
          orientation: {
            heading: camera.heading,
            pitch: Cesium.Math.toRadians(targetPitch),
            roll: 0
          },
          duration: 1.0
        });
        showToast(targetPitch === -90 ? '📐 俯视视角' : '📐 倾斜视角');
      });

      document.getElementById('btn-north').addEventListener('click', function() {
        var camera = viewer.camera;
        var carto = camera.positionCartographic;
        viewer.camera.flyTo({
          destination: Cesium.Cartesian3.fromRadians(carto.longitude, carto.latitude, carto.height),
          orientation: {
            heading: 0,
            pitch: camera.pitch,
            roll: 0
          },
          duration: 1.0
        });
        showToast('🧭 已朝北复位');
      });

      // Lighting toggle
      document.getElementById('btn-light').addEventListener('click', function() {
        lightingEnabled = !lightingEnabled;
        globe.enableLighting = lightingEnabled;
        this.classList.toggle('active', lightingEnabled);
        document.getElementById('badge-text').textContent = lightingEnabled ? '真实光照' : '标准渲染';
        showToast(lightingEnabled ? '☀ 真实光照已开启' : '🌐 标准渲染');
      });

      // Search
      var searchInput = document.getElementById('search-input');
      searchInput.addEventListener('input', function() {
        clearTimeout(searchTimeout);
        var q = this.value.trim();
        searchTimeout = setTimeout(function() { doSearch(q); }, 400);
      });
      searchInput.addEventListener('keydown', function(e) {
        if (e.key === 'Enter') {
          clearTimeout(searchTimeout);
          doSearch(this.value.trim());
        }
        if (e.key === 'Escape') {
          document.getElementById('search-results').classList.remove('show');
          this.blur();
        }
      });
      document.getElementById('search-btn').addEventListener('click', function() {
        doSearch(document.getElementById('search-input').value.trim());
      });

      // Close search results on outside click
      document.addEventListener('click', function(e) {
        if (!e.target.closest('#search-bar')) {
          document.getElementById('search-results').classList.remove('show');
        }
      });

      // Keyboard shortcuts
      document.addEventListener('keydown', function(e) {
        if (e.target.tagName === 'INPUT') return;
        switch(e.key) {
          case 'h': case 'H': document.getElementById('btn-home').click(); break;
          case 'l': case 'L': document.getElementById('btn-light').click(); break;
          case 'n': case 'N': document.getElementById('btn-north').click(); break;
          case '/': e.preventDefault(); document.getElementById('search-input').focus(); break;
        }
      });
    }

    // ── Suppress console noise from blocked external requests ──
    (function() {
      var origError = console.error;
      console.error = function() {
        var msg = arguments[0];
        if (typeof msg === 'string' && (
          msg.indexOf('ion.cesium.com') !== -1 ||
          msg.indexOf('cesium.com') !== -1 ||
          msg.indexOf('assets.ion') !== -1
        )) return;
        origError.apply(console, arguments);
      };
    })();

    // ── Boot ────────────────────────────────────────────
    initViewer();
    bindEvents();
    updateTelemetry();
  </script>
</body>
</html>
