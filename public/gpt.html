<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>鹈鹕的海边骑行</title>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; background: #d8eee9; color: #213e40; font-family: "Microsoft YaHei", sans-serif; }
    main { min-height: 100svh; display: grid; grid-template-rows: auto 1fr auto; overflow: hidden; }
    header { padding: 28px 6vw 0; display: flex; align-items: baseline; justify-content: space-between; gap: 12px; }
    h1 { margin: 0; font-size: 24px; font-weight: 600; }
    header span { font-size: 12px; }
    .scene { width: 100%; align-self: center; display: block; max-height: 78svh; }
    footer { display: flex; justify-content: center; padding: 12px 20px 28px; }
    button { width: 52px; height: 52px; border-radius: 50%; border: 1px solid #799d96; background: #ffffffaa; color: #213e40; cursor: pointer; display: grid; place-items: center; }
    button:hover { background: white; }
    button:focus-visible { outline: 3px solid #db644e; outline-offset: 4px; }
    button svg { width: 20px; height: 20px; }
    .spin { animation: spin 1.5s linear infinite; }
    .wheel-left { transform-origin: 330px 455px; }
    .wheel-right { transform-origin: 650px 455px; }
    .rider { animation: bob .75s ease-in-out infinite; }
    .wing { transform-origin: 455px 276px; animation: wing .75s ease-in-out infinite; }
    .scenery { animation: drift 9s linear infinite; }
    .road { animation: drift 2s linear infinite; }
    .cloud { animation: drift 38s linear infinite; }
    .paused * { animation-play-state: paused !important; }
    @keyframes spin { to { transform: rotate(360deg); } }
    @keyframes bob { 50% { transform: translateY(3px) rotate(.35deg); } }
    @keyframes wing { 50% { transform: rotate(-3deg); } }
    @keyframes drift { to { transform: translateX(-1000px); } }
    @media (max-width: 600px) { header { padding-top: 24px; } h1 { font-size: 20px; } header span { display: none; } .scene { width: 150%; max-width: none; margin-left: -25%; } }
  </style>
</head>
<body>
<main>
  <header><h1>鹈鹕的海边骑行</h1><span>海风正好，慢慢骑。</span></header>
  <svg class="scene" viewBox="0 0 1000 620" role="img" aria-labelledby="scene-title scene-desc">
    <title id="scene-title">鹈鹕骑自行车</title>
    <desc id="scene-desc">白色鹈鹕骑着珊瑚红自行车沿海岸前进，双脚交替踩踏，车轮旋转，远处有海浪和灯塔。</desc>
    <defs>
      <pattern id="spokes" width="1" height="1"><path d="M0 0"/></pattern>
      <g id="wheel">
        <circle r="88" fill="#f6fcf555" stroke="#273f43" stroke-width="10"/>
        <circle r="79" fill="none" stroke="#fdfbf0" stroke-width="3"/>
        <g stroke="#7f9998" stroke-width="2">
          <path d="M-77 0H77M0-77V77M-55-55L55 55M-55 55L55-55M-71-30L71 30M-30-71L30 71M-71 30L71-30M-30 71L30-71"/>
        </g>
        <circle r="9" fill="#273f43"/><path d="M49-62L58-54" stroke="#e5ab4d" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g id="cloud" fill="#f8fcf3"><path d="M0 0C-10-19 9-31 27-26C29-53 70-53 77-26C99-34 116-16 107 0Z"/></g>
      <g id="coast">
        <path d="M0 386Q150 359 300 384T600 382T1000 378V433H0Z" fill="#8ab9a1"/>
        <g transform="translate(835 287)"><path d="M-15 92L-10 0H10L17 92Z" fill="#f8f4df"/><path d="M-13 58H14L13 39H-12Z" fill="#d96957"/><path d="M-13 7H13V-7H-13Z" fill="#355c5b"/><path d="M-20-8L0-22L20-8Z" fill="#d96957"/><path d="M-22 92H24" stroke="#426d64" stroke-width="5"/></g>
        <g fill="#507f70"><path d="M100 406l9-33 8 34 14-23-6 26Z"/><path d="M745 419l9-29 4 23 14-16-7 25Z"/></g>
      </g>
      <g id="roadmarks" stroke="#f8f4dc" stroke-width="4" stroke-linecap="round"><path d="M20 572h64m133 0h64m133 0h64m133 0h64m133 0h64"/></g>
    </defs>
    <circle cx="760" cy="122" r="48" fill="#f4c868"/>
    <g class="cloud"><use href="#cloud" x="170" y="152"/><use href="#cloud" x="640" y="210"/><use href="#cloud" x="1170" y="152"/><use href="#cloud" x="1640" y="210"/></g>
    <path d="M0 333Q230 315 470 333T1000 330V445H0Z" fill="#84c4c5"/>
    <g fill="none" stroke="#c5e8de" stroke-width="3" stroke-linecap="round"><path d="M62 353h90m80 17h55m390-20h106m95 23h90M360 351h48"/></g>
    <g class="scenery"><use href="#coast"/><use href="#coast" x="1000"/></g>
    <path d="M0 432H1000V620H0Z" fill="#c1d0b8"/>
    <path d="M0 445H1000" stroke="#f4f1da" stroke-width="5"/>
    <g class="road"><use href="#roadmarks"/><use href="#roadmarks" x="1000"/></g>
    <ellipse cx="490" cy="549" rx="239" ry="13" fill="#47665c" opacity=".13"/>
    <g class="spin wheel-left"><use href="#wheel" x="330" y="455"/></g>
    <g class="spin wheel-right"><use href="#wheel" x="650" y="455"/></g>
    <path id="far-leg" d="M448 326L494 375L508 443" fill="none" stroke="#bf883c" stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="far-foot" d="M497 443h28" stroke="#bf883c" stroke-width="10" stroke-linecap="round"/>
    <g fill="none" stroke="#d85f4d" stroke-width="9" stroke-linecap="round" stroke-linejoin="round">
      <path d="M330 455L411 354L477 455ZM411 354L601 354L477 455M601 354L650 455M477 455L401 330"/>
      <path d="M601 354L585 306L613 293" stroke="#365153" stroke-width="7"/>
    </g>
    <path d="M380 330H432" stroke="#293f43" stroke-width="12" stroke-linecap="round"/>
    <path d="M601 294L623 291" stroke="#293f43" stroke-width="11" stroke-linecap="round"/>
    <circle cx="477" cy="455" r="22" fill="#e9e8d7" stroke="#365153" stroke-width="4"/>
    <path d="M477 436L330 445V465L477 474" fill="none" stroke="#365153" stroke-width="2"/>
    <g class="rider">
      <path d="M405 303L349 279L372 324L417 332" fill="#eaf0e4" stroke="#365153" stroke-width="3" stroke-linejoin="round"/>
      <path d="M393 312C373 279 391 242 430 239C461 234 478 259 493 269C507 277 515 256 511 230L504 174C500 144 520 123 543 128C572 132 582 158 568 185C553 215 561 242 552 274C544 310 506 340 455 343C425 345 405 333 393 312Z" fill="#fcfbec" stroke="#365153" stroke-width="3.5"/>
      <path d="M518 192C525 226 537 250 520 284C498 321 449 336 416 320C443 347 509 344 539 305C567 268 550 228 560 192Z" fill="#dce8db"/>
      <path d="M556 169L702 189Q657 245 565 202Z" fill="#efb958" stroke="#365153" stroke-width="3" stroke-linejoin="round"/>
      <path d="M555 166Q615 161 705 187L702 193L555 182Z" fill="#efcd78" stroke="#365153" stroke-width="3" stroke-linejoin="round"/>
      <path d="M571 201Q622 222 675 200" fill="none" stroke="#d7973d" stroke-width="2"/>
      <circle cx="546" cy="153" r="6" fill="#263f41"/><circle cx="548" cy="151" r="2" fill="white"/>
      <path d="M518 127l-6-12m15 9-1-13" stroke="#365153" stroke-width="3" stroke-linecap="round"/>
      <path d="M507 220Q530 230 554 219L556 231Q533 244 509 232Z" fill="#da6652"/>
      <path d="M510 226L461 218L470 232L456 243Q487 246 516 234" fill="#da6652"/>
      <g class="wing"><path d="M421 267C441 245 468 262 485 282L539 295L604 292Q614 296 607 304L536 313C507 312 464 310 439 297" fill="#eef2e5" stroke="#365153" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/><path d="M428 277Q444 287 470 291M427 287Q445 298 464 299" fill="none" stroke="#b9ccc0" stroke-width="3" stroke-linecap="round"/></g>
    </g>
    <path id="near-leg" d="M447 329L425 396L446 467" fill="none" stroke="#e2a84d" stroke-width="14" stroke-linecap="round" stroke-linejoin="round"/>
    <path id="crank" d="M446 467L508 443" stroke="#365153" stroke-width="5" stroke-linecap="round"/>
    <path id="near-foot" d="M435 463L458 463L467 470H437Z" fill="#edb854" stroke="#365153" stroke-width="2" stroke-linejoin="round"/>
    <path id="near-pedal" d="M434 475h27" stroke="#293f43" stroke-width="6" stroke-linecap="round"/>
    <path id="far-pedal" d="M497 451h27" stroke="#293f43" stroke-width="6" stroke-linecap="round"/>
  </svg>
  <footer><button id="toggle" type="button" aria-label="暂停动画" title="暂停动画"><svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path id="toggle-icon" d="M6 4h4v16H6zM14 4h4v16h-4z"/></svg></button></footer>
</main>
<script>
  const elements = Object.fromEntries(['near-leg','far-leg','near-foot','far-foot','crank','near-pedal','far-pedal'].map(id => [id, document.getElementById(id)]));
  const toggle = document.getElementById('toggle');
  let paused = matchMedia('(prefers-reduced-motion: reduce)').matches;
  let phase = 2.8;
  let previous = null;
  function updateControls() {
    document.body.classList.toggle('paused', paused);
    toggle.setAttribute('aria-label', paused ? '播放动画' : '暂停动画');
    toggle.title = paused ? '播放动画' : '暂停动画';
    document.getElementById('toggle-icon').setAttribute('d', paused ? 'M7 3l15 9-15 9z' : 'M6 4h4v16H6zM14 4h4v16h-4z');
  }
  toggle.addEventListener('click', () => { paused = !paused; updateControls(); });
  function draw() {
    const x = 477 + Math.cos(phase) * 34, y = 455 + Math.sin(phase) * 34;
    const bx = 954 - x, by = 910 - y;
    // Solve a two-segment leg so the foot stays attached to the rotating pedal.
    function leg(hipX, hipY, footX, footY, side) {
      const dx = footX - hipX, dy = footY - hipY, d = Math.hypot(dx, dy);
      const offset = Math.sqrt(Math.max(0, 88 * 88 - d * d / 4));
      return `M${hipX} ${hipY}L${(hipX + footX) / 2 + side * dy / d * offset} ${(hipY + footY) / 2 - side * dx / d * offset}L${footX} ${footY}`;
    }
    elements['near-leg'].setAttribute('d', leg(447, 329, x, y - 6, -1));
    elements['far-leg'].setAttribute('d', leg(457, 330, bx, by - 6, 1));
    elements.crank.setAttribute('d', `M${x} ${y}L${bx} ${by}`);
    elements['near-foot'].setAttribute('d', `M${x-12} ${y-10}h22l10 8h-32Z`);
    elements['far-foot'].setAttribute('d', `M${bx-9} ${by-5}h25`);
    elements['near-pedal'].setAttribute('d', `M${x-14} ${y+2}h29`);
    elements['far-pedal'].setAttribute('d', `M${bx-14} ${by+2}h29`);
  }
  function animate(time) {
    if (previous !== null && !paused) phase += Math.min(time - previous, 50) / 1500 * Math.PI * 2;
    previous = time;
    draw();
    requestAnimationFrame(animate);
  }
  updateControls();
  requestAnimationFrame(animate);
</script>
</body>
</html>
